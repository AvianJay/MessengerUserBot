[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "messenger-userbot"
version = "1.0.0"
description = "A Python library for creating Messenger bots using Selenium"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [
    {name = "AvianJay"}
]
keywords = ["messenger", "bot", "facebook", "automation", "selenium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "selenium",
    "webdriver-manager",
    "requests",
]

[project.optional-dependencies]
server = ["flask"]
ai = ["g4f"]
image = ["Pillow"]
full = ["flask", "g4f", "Pillow"]

[project.urls]
Homepage = "https://github.com/AvianJay/MessengerUserBot"
Repository = "https://github.com/AvianJay/MessengerUserBot"
Issues = "https://github.com/AvianJay/MessengerUserBot/issues"
